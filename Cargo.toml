[package]
name = "sockcast-client"
version = "0.1.0"
edition = "2021"
description = "Sockcast Roaming SSH Agent Workstation Client & Enrollment CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/theraphim/sockcast-client"
default-run = "sockcast-client"

[[bin]]
name = "sockcast-client"
path = "src/main.rs"

[[bin]]
name = "sockcast-tray"
path = "src/bin/sockcast-tray.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
libc = "0.2"
prost = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sockcast-proto = { path = "sockcast-proto" }
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "io-std", "sync", "time", "signal", "rt-multi-thread", "macros", "fs", "process"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
toml = "0.8"
tonic = { version = "0.12", features = ["transport", "tls", "tls-native-roots", "tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.31", optional = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "bitflags",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSBox",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageCell",
    "NSImageView",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSPasteboard",
    "NSPopUpButton",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSScrollView",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextField",
    "NSTextFieldCell",
    "NSTextView",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSThread",
    "NSURL",
    "objc2-core-foundation",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dev-dependencies]
tempfile = "3"
